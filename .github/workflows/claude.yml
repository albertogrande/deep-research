# @claude on issues/PRs — triage, review, and small fixes via claude-code-action.
# INERT until a maintainer adds the ANTHROPIC_API_KEY repository secret (Settings →
# Secrets and variables → Actions). Costs money when active; scope stays limited to
# responding when explicitly mentioned.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: contains(github.event.comment.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
