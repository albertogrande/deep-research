[project]
name = "deepresearch"
version = "0.1.0"
description = "An open-source deep research agent system built end-to-end on the Pydantic stack: Pydantic AI, Logfire, Pydantic Evals, and the Pydantic AI Gateway."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alberto Grande", email = "grande.temprado@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["deep-research", "agents", "pydantic-ai", "logfire", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "genai-prices>=0.0.35",
    "markdown-it-py>=3.0.0",
    "pydantic-ai-slim[anthropic,logfire,retries]>=2.13.0",
    "pydantic-evals>=2.13.0",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/albertogrande/deep-research"
Repository = "https://github.com/albertogrande/deep-research"
Changelog = "https://github.com/albertogrande/deep-research/blob/main/CHANGELOG.md"
Issues = "https://github.com/albertogrande/deep-research/issues"

[project.scripts]
deepresearch = "deepresearch.cli:app"
deepresearch-mcp = "deepresearch.mcp_server:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "httpx>=0.28.1",
    "mcp>=1.2",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call real APIs and cost money (skipped unless RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]

[tool.pyright]
include = ["src", "evals"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/deepresearch"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
